<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with squircle radius -->
  <rect width="512" height="512" rx="108" fill="#0f172a" />
  <rect x="24" y="24" width="464" height="464" rx="90" fill="url(#bg)" fill-opacity="0.15" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Video Clapper / Film slate icon -->
  <g transform="translate(100, 116)">
    <!-- Main screen / film body -->
    <rect x="0" y="50" width="312" height="220" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="12" />
    <!-- Play arrow -->
    <polygon points="125,115 215,160 125,205" fill="#38bdf8" />
    
    <!-- Top filmstrip header -->
    <path d="M 0,28 C 0,12 12,0 28,0 L 284,0 C 300,0 312,12 312,28 L 312,46 L 0,46 Z" fill="#0284c7" />
    <!-- Filmstrip sprocket holes -->
    <rect x="36" y="10" width="24" height="26" rx="4" fill="#0f172a" />
    <rect x="96" y="10" width="24" height="26" rx="4" fill="#0f172a" />
    <rect x="156" y="10" width="24" height="26" rx="4" fill="#0f172a" />
    <rect x="216" y="10" width="24" height="26" rx="4" fill="#0f172a" />
    
    <!-- Annotation note badge in bottom right -->
    <circle cx="280" cy="240" r="42" fill="#0284c7" stroke="#0f172a" stroke-width="8" />
    <!-- Pen / note lines -->
    <line x1="262" y1="230" x2="298" y2="230" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="262" y1="242" x2="292" y2="242" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="262" y1="254" x2="282" y2="254" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
